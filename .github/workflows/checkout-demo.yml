name: Checkout Demo

on:
  push:
    branches: [ main ]

jobs:
  without-checkout:
    runs-on: ubuntu-latest
    steps:
      - name: 不 checkout 直接 ls
        run: ls -la

  with-checkout:
    runs-on: ubuntu-latest
    steps:
      - name: 先 checkout
        uses: actions/checkout@v4
      - name: 再 ls
        run: ls -laS